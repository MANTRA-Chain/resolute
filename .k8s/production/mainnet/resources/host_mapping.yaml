apiVersion: getambassador.io/v3alpha1
kind: Host
metadata:
  name: resolute-init-mantrachain-io
  annotations:
    external-dns.ambassador-service: emissary-ingress.emissary
spec:
  hostname: resolute.int.mantrachain.io
  acmeProvider:
    authority: none
  tlsSecret:
    name: int.asia-east2-std.mantrachain.io-wildcard-tls-secret
    namespace: emissary
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: resolute-frontend
spec:
  hostname: "resolute.int.mantrachain.io"
  prefix: /
  service: resolute-frontend-mainnet:3000
---
apiVersion: getambassador.io/v3alpha1
kind: Mapping
metadata:
  name: resolute-server
spec:
  hostname: "resolute.int.mantrachain.io"
  prefix: '/api(/|$)(.*)'
  prefix_regex: true
  regex_rewrite:
    pattern: '/api/?(.*)'
    substitution: '/\1'
  service: resolute-server-mainnet:8000
  allow_upgrade:
  - websocket
